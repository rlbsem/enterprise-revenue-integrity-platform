name: Portable operator acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portable-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  compose-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PLAYWRIGHT_BROWSERS_PATH: .local/browsers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r requirements.lock
      - name: Check preserved portable records
        run: |
          python scripts/check_portable_evidence.py docs/evidence/portable/compose-run01
          python scripts/check_portable_evidence.py docs/evidence/portable/failed-build-run01 --failed
      - run: npx --yes pnpm@11.25.0 install --frozen-lockfile --ignore-scripts
      - run: node node_modules/playwright/cli.js install chromium
        timeout-minutes: 5
      - name: Build public-source normal image
        run: docker compose --progress plain build demo
      - run: python scripts/verify_portable.py --workspace .local/portable-ci --output .local/portable-evidence
      - run: python scripts/check_portable_evidence.py .local/portable-evidence
      - name: Independent fresh-state repetition
        run: python scripts/verify_portable.py --workspace .local/portable-repeat-ci --output .local/portable-repeat-evidence
      - run: python scripts/check_portable_evidence.py .local/portable-repeat-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: portable-operator-evidence
          path: .local/portable-evidence/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: portable-repeat-evidence
          path: .local/portable-repeat-evidence/
          if-no-files-found: warn
          retention-days: 14
