[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-revenue-integrity-platform"
version = "0.1.0"
description = "Durable order-to-cash integration with independently verified effects"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.162.0", "uvicorn==0.38.0", "httpx==0.28.1", "psycopg[binary]==3.2.12", "pydantic==2.12.3", "dbt-duckdb==1.11.0", "dbt-core==1.12.6", "duckdb==2.0.0"]

[project.optional-dependencies]
test = ["pytest==9.0.3", "ruff==0.14.2", "pip-audit==2.10.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
integrity = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
